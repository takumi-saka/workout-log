plugins {
    id 'com.android.application'
}

android {
    namespace 'com.takumisaka.workoutlog'
    compileSdk 34

    defaultConfig {
        applicationId 'com.takumisaka.workoutlog'
        minSdk 24
        targetSdk 34
        // GitHub で作るたびに番号が上がるので、上から入れ直せる
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName '2.0'
    }

    // 自分用のアプリなので、署名の鍵はリポジトリに置いている（同じ鍵で署名しないと上から入れ直せない）
    signingConfigs {
        release {
            storeFile file('release.p12')
            storePassword 'workoutlog'
            keyAlias 'workoutlog'
            keyPassword 'workoutlog'
            storeType 'pkcs12'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
