<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d40e0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="自分用の筋トレ記録アプリ">
<title>筋トレログ</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@1,62..125,700..900&family=Murecho:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles/app.css">
</head>
<body>
<div class="device">
  <main class="screens">
    <section class="screen active" data-screen="record" id="screen-record">
      <div class="scroller" id="recScroller">
        <section class="hero" id="recHero"></section>
        <div class="body" id="recBody"></div>
      </div>
    </section>
    <section class="screen light" data-screen="history" id="screen-history"><div class="scroller"></div></section>
    <section class="screen light" data-screen="progress" id="screen-progress"><div class="scroller"></div></section>
    <section class="screen light" data-screen="menu" id="screen-menu"><div class="scroller"></div></section>
    <section class="screen light" data-screen="settings" id="screen-settings"><div class="scroller"></div></section>
  </main>

  <nav class="tabs" aria-label="画面の切り替え">
    <button data-action="go:tab" data-tab="record" class="is-active"><svg class="i" viewBox="0 0 24 24"><path d="M6 7v10M3 9.5v5M18 7v10M21 9.5v5M6 12h12"/></svg>記録</button>
    <button data-action="go:tab" data-tab="history"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4M8 14h2M14 14h2M8 17h2"/></svg>履歴</button>
    <button data-action="go:tab" data-tab="progress"><svg class="i" viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/></svg>進捗</button>
    <button data-action="go:tab" data-tab="menu"><svg class="i" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>メニュー</button>
  </nav>

  <div id="layer"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"><span class="toast-text"></span><button class="toast-btn" data-action="toast:action" hidden></button></div>
</div>
<noscript><p style="padding:24px">このアプリを使うには、ブラウザの JavaScript をオンにしてください。</p></noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
